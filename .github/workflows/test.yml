name: Tests

# Every pull request, whatever it targets, plus pushes to the version lines.
#
# This used to be `branches: [v3]` on both. Development moved to v2 in June and the
# trigger was never re-pointed, so for two months this workflow ran on nothing that
# mattered: v2 is where origin/HEAD points and where every recent merge landed, and
# not one of them was gated. PR #21 merged the day before this was noticed, untested.
#
# The pull_request filter is deliberately GONE rather than widened to [v2, v3, v4].
# A branch allowlist is what went stale the first time, and it will go stale again
# the day a v5 appears or a program runs on its own integration branch — which is
# exactly what surfaced this. An unfiltered trigger cannot rot that way.
on:
  push:
    branches: [v2, v3, v4]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # rustypot (Rust ext) and the adafruit/board stack need robot hardware;
      # tests stub them, so install only what the server + telemetry import.
      - name: Install dependencies
        run: |
          pip install "fastapi>=0.115.0" "uvicorn>=0.30.0" "pydantic>=2.0.0" \
                      "posthog>=3.0" numpy pyserial pytest httpx
          pip install -e . --no-deps
      - name: Run pytest
        run: pytest tests/ -v

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint setup.sh
        run: |
          bash -n scripts/setup.sh
          shellcheck scripts/setup.sh
