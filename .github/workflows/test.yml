name: Tests

on:
  push:
    # v2 is origin/HEAD and the branch scripts/setup.sh git-pulls onto real ducks,
    # so it is what the fleet actually runs -- but it was not tested. A PR into v2
    # ran zero jobs. v3 kept for whatever is being developed there.
    branches: [v2, v3]
  pull_request:
    branches: [v2, v3]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # rustypot (Rust ext) and the adafruit/board stack need robot hardware;
      # tests stub them, so install only what the server + telemetry import.
      - name: Install dependencies
        run: |
          pip install "fastapi>=0.115.0" "uvicorn>=0.30.0" "pydantic>=2.0.0" \
                      "posthog>=3.0" numpy pyserial pytest httpx
          pip install -e . --no-deps
      - name: Run pytest
        run: pytest tests/ -v

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint setup.sh
        run: |
          bash -n scripts/setup.sh
          shellcheck scripts/setup.sh
