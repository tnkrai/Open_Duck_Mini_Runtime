name: Tests

# v2 first, because v2 is the default branch and where everything actually
# lands. This used to say `[v3]` alone, which meant the suite had never run on
# a single v2 pull request -- v3 has been dormant since June and is 40 commits
# behind. A green PR into v2 was green because nothing checked it.
#
# v3 stays listed rather than being removed: it still holds two commits that
# are not in v2, so it is dormant, not provably dead, and listing it costs
# nothing.
on:
  push:
    branches: [v2, v3]
  pull_request:
    branches: [v2, v3]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # rustypot (Rust ext) and the adafruit/board stack need robot hardware;
      # tests stub them, so install only what the server + telemetry import.
      - name: Install dependencies
        run: |
          pip install "fastapi>=0.115.0" "uvicorn>=0.30.0" "pydantic>=2.0.0" \
                      "posthog>=3.0" numpy pyserial pytest httpx
          pip install -e . --no-deps
      - name: Run pytest
        run: pytest tests/ -v

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint setup.sh
        run: |
          bash -n scripts/setup.sh
          shellcheck scripts/setup.sh
